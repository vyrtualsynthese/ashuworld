# Default values for the AshuWorld chart.
#
# Postgres is not part of this chart. The cluster already has one, and the chart only reads
# its connection URL from a Secret that the operator creates; there is no value here that
# could put a connection string into `helm get manifest`.
#
# One hostname, path-routed: `/` to web, `/api` and `/auth` to api. The single origin is a
# hard requirement, because the session cookie is HttpOnly and every call the pages make is
# an absolute /api or /auth path.

nameOverride: ""
fullnameOverride: ""

# Shared by every image unless its component overrides it. CI publishes `latest` from develop
# and the commit SHA from every build; a real deployment sets this to that SHA, so a pod
# restart cannot change which commit it runs.
image:
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

api:
  image:
    # Replace with the repository CI publishes to, e.g. ghcr.io/<owner>/<repo>/api.
    repository: ghcr.io/your-org/ashuworld/api
    # Empty means "the shared image.tag", and then the chart's appVersion.
    tag: ""
  replicaCount: 1
  port: 3000
  # Extra environment, rendered after the values the chart fixes itself. Useful for
  # ALLOW_DEV_LOGIN, SESSION_COOKIE_NAME and COOKIE_SECURE. DATABASE_URL, PORT,
  # PUBLIC_BASE_URL, TRUST_PROXY and GAME_CONFIG_VERSION are set by the chart and cannot be
  # overridden here.
  env:
    # The dev sign-in door is a separate switch from the web build flag, because the api
    # decides whether /auth/dev/start exists and the web bundle decides whether to show the
    # button. It is off by default, and a real deployment leaves it off: Twitch signs fans in
    # with its own keys, and a deployment with no provider configured tells the fan that no
    # sign-in is available.
    ALLOW_DEV_LOGIN: "false"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  image:
    repository: ghcr.io/your-org/ashuworld/web
    tag: ""
  replicaCount: 1
  # nginx listens on an unprivileged port, so the image runs as uid 101 with no capabilities.
  port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

worker:
  image:
    repository: ghcr.io/your-org/ashuworld/worker
    tag: ""
  replicaCount: 1
  # The port a provider adapter will bind. It is only declared, and the worker's Service is
  # only created, when hooks.enabled is true; the worker itself binds nothing today.
  hooksPort: 3001
  # Extra environment, rendered after the fixed ones. The worker has no HTTP port and no
  # probes; it is ready when it is running.
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

migrate:
  # The Job that runs before install and upgrade. It uses the api image, which is the one
  # that carries dist/migrate.js and the .sql files.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

postgres:
  # The name of an existing Secret in the release namespace. This chart never creates it and
  # never renders its contents: the connection URL is an external fact that must not appear
  # in a manifest, a shell history or a values file in the repository.
  secretName: ashuworld-postgres
  # The key in that Secret whose value is the full `postgres://user:pass@host/db` URL.
  urlKey: url

erasure:
  # The Secret holding the erasure pepper: the server-side key that turns a provider id into
  # the one-way value stored in the database. The chart never renders this Secret and has no
  # value for it; the operator creates it, because losing it is unrecoverable for every row
  # already erased and leaking it would re-link those rows to real accounts:
  #
  #   kubectl create secret generic ashuworld-erasure \
  #     --from-literal=pepper="$(openssl rand -base64 48)"
  pepperSecretName: ashuworld-erasure
  # The key in that Secret whose value is the pepper itself.
  pepperKey: pepper

providers:
  # The name of an existing Secret in the release namespace that holds the OAuth credentials
  # for the sign-in and follower providers. Like the database URL above, it is an external
  # fact: the chart never creates it and never renders its contents, because a client secret
  # in a manifest is also a client secret in `helm get manifest` and in the release's stored
  # values.
  #
  # The keys read from it, none of which the chart requires:
  #   twitch-client-id      -> TWITCH_CLIENT_ID             (api and worker)
  #   twitch-client-secret  -> TWITCH_CLIENT_SECRET         (api and worker)
  #   twitch-channel-token  -> TWITCH_CHANNEL_REFRESH_TOKEN (worker only)
  #   platform-token-key    -> PLATFORM_TOKEN_KEY           (worker only)
  #
  #   kubectl create secret generic ashuworld-providers \
  #     --from-literal=twitch-client-id='<client id>' \
  #     --from-literal=twitch-client-secret='<client secret>' \
  #     --from-literal=twitch-channel-token='<refresh token from twitch-authorize>' \
  #     --from-literal=platform-token-key='<the key the stored grant was sealed with>'
  #
  # platform-token-key is the key the worker encrypts the stored Twitch grant with (a fresh
  # one comes from `openssl rand -base64 32`). It must be the same key the worker sealed the
  # stored grant with, so copy the value out of the environment that created it: a different
  # key cannot open the stored tokens, and the follower poll stops with an error saying so.
  #
  # Every reference is optional. A missing key means "that provider is off" and the pod starts
  # normally; a half-filled client pair is the api's and worker's own startup error, not a
  # pod that never appears. An empty secretName mounts no provider credential at all.
  secretName: ""
  twitch:
    # The Twitch channel the follower poll reads, and the account the sign-in door expects.
    # It is not a credential, so it is plain environment on both Deployments, and it is left
    # out entirely while empty: the provider is off until both this and the Secret are set.
    channelLogin: ""

game:
  # Must match "version" in packages/gameconfig/config/game.json. The api and worker receive
  # it as GAME_CONFIG_VERSION, and the alpha reset Job logs it with the counts it deleted.
  # The purge CronJob receives it too, so a retention window chosen from a game version
  # change is visible in the run's environment.
  configVersion: "2026-11-14.2"

ingress:
  enabled: true
  # The cluster's ingress class. Empty leaves the choice to a default class, which is the
  # right default for a single-class cluster.
  className: ""
  # Replace per environment. The chart refuses to render an empty host: inventing one would
  # produce a certificate and a callback URL that nobody registered.
  host: ashuworld.example.com
  # The scheme the browser uses. PUBLIC_BASE_URL is built from it, and the session cookie's
  # Secure flag follows PUBLIC_BASE_URL when COOKIE_SECURE is not set explicitly.
  scheme: https
  annotations: {}
  tls:
    enabled: true
    # Empty means "<release>-ashuworld-tls", for cert-manager or a pre-made certificate.
    secretName: ""

hooks:
  # The worker binds no HTTP port until a real provider adapter exists, so the /hooks path
  # must not be routed. Turning this on without an adapter installs an ingress path that
  # fails every request: leave it false until the Twitch plan lands.
  enabled: false

alphaReset:
  # The destructive Job renders only when this is true. Its command is wired by the alpha
  # reset task; until then, enabling it runs a Job that exits non-zero.
  enabled: false
  # Create the confirm Secret from the value below. Set to false and fill secretName to use
  # one the operator created instead.
  createSecret: true
  confirm: reset-ashuworld
  secretName: ""
  # The key that holds the confirm value in the Secret.
  secretKey: confirm
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

levelRecompute:
  # One-shot Job for a level-table change in game.json. Its command is
  # `node dist/worker.js recompute-levels`: it re-reads every fan's peak XP through the
  # current table and raises the levels that now qualify, never lowering one. Like the
  # alpha reset, it is a plain Job an operator turns on, runs, and deletes.
  enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

purge:
  # The daily retention pass: a CronJob running `node dist/worker.js purge`, which deletes the
  # rows older than the documented retention windows. Off by default, because it deletes data
  # and turning it on is an operator decision, not something an upgrade should make.
  enabled: false
  # Daily, at 03:17 rather than on the hour: the pass competes with nothing else at that
  # minute, and a fixed offset makes the run easy to find in the pod history.
  schedule: "17 3 * * *"
  # Arms the pass. The code compares this exact string and refuses anything else, so a typo
  # in a values file cannot run a deletion.
  confirm: purge-ashuworld
  # Create the confirm Secret from the value above. Set to false and fill secretName to use
  # one the operator created instead.
  createSecret: true
  secretName: ""
  # The key that holds the confirm value in the Secret.
  secretKey: confirm
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# The web bundle compiles VITE_DEV_LOGIN at build time (Vite replaces import.meta.env), so
# it is not a chart value: flipping it means rebuilding and republishing the web image with
# `--build-arg VITE_DEV_LOGIN=true`. The api's ALLOW_DEV_LOGIN is the matching switch above.
