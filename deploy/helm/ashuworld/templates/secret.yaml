{{/*
This file renders no Secret for the database, on purpose.

The connection URL is an external fact owned by the cluster, not by this chart. The chart
reads it through `postgres.secretName` / `postgres.urlKey` and every workload uses the same
`secretKeyRef` (see `ashuworld.databaseUrlEnv` in _helpers.tpl):

    kubectl create secret generic ashuworld-postgres \
      --from-literal=url='postgres://user:password@host:5432/ashuworld'

Creating that Secret from a chart value would put the password in `helm get manifest`, in
the release's stored values and in the shell history that ran `helm upgrade --set`. None of
those is a place a database password belongs.

What this file does render, only when the alpha reset is enabled, is the confirm token that
arms the destructive Job. It is a fixed string the code compares against, not a credential,
so a chart-created Secret is the right home for it: the Job cannot start on a typo in a
values file, and the manifest shows a Secret reference rather than the value.
*/}}
{{- if and .Values.alphaReset.enabled .Values.alphaReset.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ashuworld.resetSecretName" . }}
  labels:
    {{- include "ashuworld.labels" . | nindent 4 }}
    app.kubernetes.io/component: alpha-reset
type: Opaque
stringData:
  {{ .Values.alphaReset.secretKey }}: {{ required "alphaReset.confirm is required when the chart creates the reset Secret" .Values.alphaReset.confirm | quote }}
{{- end }}
