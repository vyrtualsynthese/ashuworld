apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ashuworld.fullname" . }}-web
  labels:
    {{- include "ashuworld.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "ashuworld.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ashuworld.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # uid 101 is the `nginx` user the image already contains. fsGroup is what makes the
      # mounted /tmp emptyDir writable by it: the kubelet chowns the volume to the group,
      # and nginx needs that one directory for its pid file, buffers and rendered config.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "ashuworld.image" (dict "root" . "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            # The api Service is a release-time name, so nginx's server block is rendered
            # from a template at container start rather than baked into the image.
            - name: API_UPSTREAM
              value: {{ printf "http://%s:%d" (include "ashuworld.apiServiceName" .) (int .Values.api.port) | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The only writable path the container has, and the only one nginx needs.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ashuworld.fullname" . }}-web
  labels:
    {{- include "ashuworld.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "ashuworld.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    # Port 80 on the Service, 8080 in the container: the ingress can stay conventional
    # while the image keeps an unprivileged listener.
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
