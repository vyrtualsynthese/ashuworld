apiVersion: v2
name: ashuworld
description: >-
  Fan XP and levels for the AshuWorld channel: the api, the web app and the worker that
  drains the event outbox, with a migration Job that runs before every release.
type: application

# Chart version: the shapes of the values and the templates. Bump on a breaking change to
# values.yaml.
version: 0.1.0

# The commit the images are expected to be tagged with. CI overrides image.tag with the
# commit SHA, so this is only the fallback for a local install.
appVersion: "0.1.0"

kubeVersion: ">=1.27.0-0"

home: https://github.com/vyrtualsynthese/ashuworld
sources:
  - https://github.com/vyrtualsynthese/ashuworld
