name: CI

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ashu
          POSTGRES_PASSWORD: ashu
          POSTGRES_DB: ashu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://ashu:ashu@localhost:5432/ashu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A production dependency with a known high-severity advisory blocks the build: it
      # would ship to the image without anything else in the pipeline noticing.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:coverage

  helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned rather than a setup action's default: the chart is checked with the same
      # Helm the operator runs, so a rendering difference shows up here and not on the
      # cluster. The tarball layout is the one get.helm.sh has used for both major versions.
      # The published checksum is verified before anything is extracted, so a truncated or
      # swapped download fails here instead of running a different binary.
      - name: Install Helm
        run: |
          curl -fsSLO https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v4.2.4-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.2.4-linux-amd64.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Lint the chart
        run: helm lint deploy/helm/ashuworld

      # The render script asserts what the chart promises: three Deployments, the gated
      # routes, the migration hook, hardened containers and no connection string in a
      # manifest. It is the executable version of the chart's contract.
      - name: Render the chart and assert its promises
        run: bash deploy/helm/ashuworld/test/render.sh

  images:
    name: images
    # Images are published from develop and from release tags, after the tree is green.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase repository name; `github.repository` keeps the account's
      # capitalisation.
      - name: Resolve the image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Every image carries the commit SHA, which is what a deployment pins. `latest` is
      # also pushed because values.yaml defaults to it, so a plain `helm install` without
      # --set image.tag runs the newest develop build instead of failing to pull.
      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/worker:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  # The smoke test the plan requires: the api image, its migrate entry point and its health
  # route, against the same Postgres service container the tests use. It runs after the
  # images job so a broken image is caught before it is deployed, not after.
  smoke:
    name: image smoke
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ashu
          POSTGRES_PASSWORD: ashu
          POSTGRES_DB: ashu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # `--network host` is what lets the container reach the service container on
      # 127.0.0.1:5432, the same address the test suite uses.
      - name: The image finds its migrations and applies them
        run: |
          docker pull "$IMAGE_PREFIX/api:$GITHUB_SHA"
          out="$(docker run --rm --network host \
            -e DATABASE_URL=postgres://ashu:ashu@127.0.0.1:5432/ashu \
            "$IMAGE_PREFIX/api:$GITHUB_SHA" node dist/migrate.js)"
          echo "$out"
          grep -q '4 migration file(s) found' <<<"$out"
          # A second run applies nothing: the bookkeeping table is the idempotence proof.
          again="$(docker run --rm --network host \
            -e DATABASE_URL=postgres://ashu:ashu@127.0.0.1:5432/ashu \
            "$IMAGE_PREFIX/api:$GITHUB_SHA" node dist/migrate.js)"
          echo "$again"
          grep -q 'applied 0 migration' <<<"$again"

      - name: The api answers its health route from a read-only filesystem
        run: |
          docker run -d --name api --network host --read-only \
            -e DATABASE_URL=postgres://ashu:ashu@127.0.0.1:5432/ashu \
            -e PUBLIC_BASE_URL=http://localhost:3000 \
            "$IMAGE_PREFIX/api:$GITHUB_SHA"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          docker rm -f api

      # The pages are served by nginx, not by the api, so its header set has its own check.
      # The four greps are the contract: a missing include in a location block drops the
      # whole snippet there, and only a real response shows that.
      - name: The web image sends the security headers
        run: |
          docker run -d --name web -p 8080:8080 "$IMAGE_PREFIX/web:$GITHUB_SHA"
          for _ in $(seq 1 30); do
            if curl -fsS -I http://127.0.0.1:8080/ > /tmp/web-headers.txt; then break; fi
            sleep 1
          done
          cat /tmp/web-headers.txt
          grep -qi 'content-security-policy:.*default-src' /tmp/web-headers.txt
          grep -qi 'strict-transport-security:' /tmp/web-headers.txt
          grep -qi 'x-content-type-options: nosniff' /tmp/web-headers.txt
          grep -qi 'referrer-policy:' /tmp/web-headers.txt
          # The hashed assets live in their own location block with its own include, and
          # their names change every build, so the URL is read from the served document.
          curl -fsS http://127.0.0.1:8080/ > /tmp/web-index.html
          asset="$(grep -o '/assets/[^"]*\.js' /tmp/web-index.html | head -1)"
          test -n "$asset"
          curl -fsS -I "http://127.0.0.1:8080$asset" > /tmp/web-asset-headers.txt
          cat /tmp/web-asset-headers.txt
          grep -qi 'x-content-type-options: nosniff' /tmp/web-asset-headers.txt
          grep -qi 'content-security-policy:.*default-src' /tmp/web-asset-headers.txt
          docker rm -f web
