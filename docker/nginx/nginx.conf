# The nginx runtime configuration, shared by every environment.
#
# It is written for a non-root user and a read-only root filesystem: the pid file, the
# request-body buffers and the proxy temp files all live under /tmp, which the chart mounts
# as an `emptyDir`. Logs go to the container's stdout and stderr, where the cluster's log
# pipeline expects them.

worker_processes auto;

# The image runs as uid 101, so neither the default /var/run/nginx.pid nor /var/log/nginx is
# writable. Both paths move to /tmp or to the standard streams.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Do not advertise the nginx version in error pages and the Server header.
  server_tokens off;

  # Nothing may write to disk outside /tmp: these are the modules that would otherwise.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # The server block is rendered at container start from /etc/nginx/templates by the image's
  # entrypoint, with API_UPSTREAM coming from the chart. The include stays inside the image
  # so a container started with `docker run` serves the app, not an empty configuration.
  include /tmp/*.conf;
}
