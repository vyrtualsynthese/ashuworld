# AshuWorld, locally.
#
# This runs the whole system the way production is shaped: Postgres, a migration run, the
# API, the worker, and the web image behind its own nginx (which proxies /api and /auth, so
# the session cookie stays first-party). It exists so a change can be looked at in a browser
# without a cluster.
#
#   docker compose up --build
#   open http://localhost:8080
#
# The dev sign-in is on (`ALLOW_DEV_LOGIN`) and only works here: it creates a fan named after
# the handle you give it, with no provider involved. Never set that flag in a deployment.

name: ashuworld

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ashu
      POSTGRES_PASSWORD: ashu
      POSTGRES_DB: ashu
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashu -d ashu"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://ashu:ashu@db:5432/ashu
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://ashu:ashu@db:5432/ashu
      # Development only, and it must stay that way: this is the key that makes an erased
      # account unlinkable, so a real deployment reads it from a Secret and never from a
      # file in the repository. Every stack started from this file shares this value.
      ERASURE_PEPPER: dev-pepper-not-a-secret
      PUBLIC_BASE_URL: http://localhost:8080
      SESSION_COOKIE_NAME: ashuworld_session
      COOKIE_SECURE: "false"
      ALLOW_DEV_LOGIN: "true"
      TRUST_PROXY: "false"
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://ashu:ashu@db:5432/ashu
      # The same development-only pepper as the api, because the worker's erase commands
      # key the values the api reads back. Never a deployment value.
      ERASURE_PEPPER: dev-pepper-not-a-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Shows the dev sign-in link on the account page. Off in any real deployment.
        VITE_DEV_LOGIN: "true"
    environment:
      # The api reachable from inside the web container; nginx proxies /api and /auth to it.
      API_UPSTREAM: http://api:3000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
